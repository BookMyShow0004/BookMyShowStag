<div class="theatres-container">

  <div class="mb-3">
    <button class="btn btn-secondary" style="background: #e9ecef;
    border-color: #e9ecef;
    color: black;" (click)="goBack()">
      <i class="fas fa-arrow-left"></i> Back
    </button>
  </div>

  <header class="theatres-header">
    <h1 class="header-title">Find a Theatre Near You</h1>
    <div *ngIf="movieTitle" class="selected-movie" style="margin-bottom: 1rem;">
      <span>Booking for: <strong>{{ movieTitle }}</strong></span>
    </div>
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="Search by theatre name or location..."
        [(ngModel)]="searchQuery" (input)="onSearch()">
    </div>
  </header>

  <div *ngIf="isLoading" class="loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading theatres...</p>
  </div>

  <div *ngIf="errorMessage && !isLoading" class="error-state">
    <i class="fas fa-exclamation-triangle"></i>
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="!isLoading && !errorMessage && filteredTheatres.length > 0; else noTheatres" class="theatres-grid">
    <div class="theatre-card" *ngFor="let theatre of filteredTheatres" (click)="goToShowList(theatre)"
      style="cursor:pointer;">
      <div class="theatre-card-header">
        <h2 class="theatre-name">{{ theatre.name }}</h2>
        <p class="theatre-location">
          <i class="fas fa-map-marker-alt"></i> {{ theatre.address }}
        </p>
        <div *ngIf="currentUser?.role === 'admin'" class="theatre-actions" style="position:absolute; top:10px; right:10px; z-index:2;">
          <button class="btn btn-sm btn-outline-primary mr-2" (click)="$event.stopPropagation(); editTheatre(theatre)">
            <i class="fas fa-edit"></i> Edit
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="$event.stopPropagation(); deleteTheatre(theatre)">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>
      </div>
      <div class="theatre-card-body">
        <h3 class="section-title">Today's Showtimes</h3>
        <div class="showtimes-grid d-flex flex-wrap">
          <span class="badge badge-pill badge-primary mr-2 mb-2 px-3 py-2" *ngFor="let time of theatre.showTimes"
            style="font-size:1rem; font-weight:500; border:1px solid #007bff; background-color:#e9f5ff; color:#007bff;">
            {{ time }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noTheatres>
    <div class="empty-state" *ngIf="!isLoading">
      <i class="fas fa-video-slash"></i>
      <h3>No Theatres Found</h3>
      <p>Try a different search term or check back later.</p>
    </div>
  </ng-template>

  <app-toast-notification
    [message]="toastMessage"
    [type]="toastType"
    [show]="showToast">
  </app-toast-notification>

</div>
