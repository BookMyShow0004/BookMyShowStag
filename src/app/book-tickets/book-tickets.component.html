<div class="container-fluid">
  <!-- Theatre and Showtime Selection -->
  <section *ngIf="currentStep === 1">
    <h4 class="section-title">Step 1: Select Theatre & Show Time</h4>
    <div class="theatre-buttons mb-4">
      <button *ngFor="let theatre of theatres"
              (click)="selectTheatre(theatre)"
              [ngClass]="{'selected': selectedTheatre === theatre}"
              class="btn btn-outline-primary mr-2 mb-2">
        {{ theatre.name }}
      </button>
    </div>

    <div class="show-times" *ngIf="selectedTheatre">
      <button
        *ngFor="let time of selectedTheatre.showTimes"
        class="show-time-btn"
        [ngClass]="{ 'selected': selectedShowtime === time }"
        (click)="selectShowtime(time)">
        {{ time }}
      </button>
    </div>
  </section>

  <!-- Seat Selection -->
  <section *ngIf="currentStep === 2">
    <h4 class="section-title">Step 2: Select Seats</h4>
    <div class="screen">Screen</div>
    <div class="seats-grid">
      <button *ngFor="let seat of seats"
              (click)="toggleSeat(seat)"
              [ngClass]="{'selected': selectedSeats.includes(seat), 'booked': seat.status === 'booked'}"
              [disabled]="seat.status === 'booked'">
        {{ seat.seatNumber }}
      </button>
    </div>
    <button class="btn btn-primary" (click)="confirmBooking()" [disabled]="selectedSeats.length === 0">
      Confirm Booking
    </button>
  </section>

  <!-- Summary and Actions -->
  <section class="mt-4 text-center">
    <div *ngIf="selectedSeats.length > 0" class="mb-3">
        <strong>Total: ₹{{ selectedSeats.length * 0 }}</strong>
    </div>
  </section>
</div>
