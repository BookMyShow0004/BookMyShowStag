<div class="container-fluid">
  <!-- Theater and Showtime Selection -->
  <section class="mb-4">
    <h4 class="section-title">Step 1: Select Theater & Show Time</h4>
    <div class="theater-list">
      <button
        *ngFor="let theater of theaters"
        class="theater-btn"
        [ngClass]="{ 'selected': selectedTheater?.id === theater.id }"
        (click)="selectTheater(theater)">
        {{ theater.name }}
      </button>
    </div>

    <div class="show-times" *ngIf="selectedTheater">
      <button
        *ngFor="let time of selectedTheater.showTimes"
        class="show-time-btn"
        [ngClass]="{ 'selected': selectedShowtime === time }"
        (click)="selectShowtime(time)">
        {{ time }}
      </button>
    </div>
  </section>

  <!-- Seat Selection -->
  <section *ngIf="selectedShowtime">
    <h5 class="mb-3">Select Seats</h5>
    <div class="screen">Screen</div>
    <div class="seats-grid">
      <div
        *ngFor="let seat of seats"
        class="seat"
        [ngClass]="{
          'available': seat.status === 'available',
          'selected': seat.status === 'selected',
          'booked': seat.status === 'booked'
        }"
        (click)="toggleSeat(seat)">
      </div>
    </div>
  </section>

  <!-- Summary and Actions -->
  <section class="mt-4 text-center">
    <div *ngIf="selectedSeats.length > 0" class="mb-3">
        <strong>Total: ₹{{ selectedSeats.length * (movie?.price || 0) }}</strong>
    </div>
    <button class="btn btn-primary btn-lg" (click)="confirmBooking()" [disabled]="selectedSeats.length === 0">
      Confirm Booking
    </button>
  </section>
</div>
