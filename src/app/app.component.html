<header class="app-header" *ngIf="showHeader">
  <div class="header-content">
    <a routerLink="/" class="header-brand">
      <h1><i class="fas fa-film"></i> BookMyShow</h1>
    </a>
    <span class="header-tagline">Your Ticket to Entertainment</span>

    <div class="header-actions">
      <!-- Logged Out State -->
      <ng-container *ngIf="!(currentUser$ | async)">
        <div class="auth-buttons">
          <a routerLink="/login" class="auth-btn login-btn">
            <i class="fas fa-sign-in-alt"></i>
            <span>Login</span>
          </a>
          <a routerLink="/signup" class="auth-btn signup-btn">
            <i class="fas fa-user-plus"></i>
            <span>Sign Up</span>
          </a>
        </div>
      </ng-container>

      <!-- Logged In State -->
      <ng-container *ngIf="currentUser$ | async as user">
        <div class="user-menu" (mouseenter)="isDropdownOpen = true" (mouseleave)="isDropdownOpen = false">
          <div class="user-info">
            <div class="user-avatar">{{ getInitials(user.fullName) }}</div>
            <span class="user-name">{{ user.fullName }}</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="user-dropdown" [class.open]="isDropdownOpen">
            <a routerLink="/profile" class="dropdown-item">
              <i class="fas fa-user-circle"></i> Profile
            </a>
            <a routerLink="/my-bookings" class="dropdown-item">
              <i class="fas fa-ticket-alt"></i> My Bookings
            </a>
            <hr class="dropdown-divider">
            <button (click)="logout()" class="dropdown-item logout-btn">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</header>

<main class="main-container" [class.no-header]="!showHeader">
  <router-outlet></router-outlet>
</main>
