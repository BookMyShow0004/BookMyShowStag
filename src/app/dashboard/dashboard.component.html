<div class="container-fluid py-4">

  <!-- Suggested Movies Carousel -->
  <div *ngIf="suggestedMovies.length > 0" class="mb-5">
    <h2 class="mb-4">Suggested For You</h2>
    <div class="d-flex overflow-auto pb-3">
      <div *ngFor="let movie of suggestedMovies; trackBy: trackByMovieId" class="me-3" style="width: 280px;">
        <div class="card h-100 shadow-sm border-0">
          <img [src]="movie.image" class="card-img-top" [alt]="movie.title" (click)="openBookingModal(movie)" style="cursor: pointer;">
          <div class="card-body">
            <h5 class="card-title text-truncate">{{ movie.title }}</h5>
            <p class="card-text text-muted">{{ movie.genre }}</p>
          </div>
          <div class="card-footer bg-white border-0">
            <button class="btn btn-primary w-100" (click)="openBookingModal(movie)">Book Now</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- All Movies Grid -->
  <div>
    <h2 class="mb-4">All Movies</h2>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4" *ngIf="movies.length > 0; else noMovies">
      <div class="col" *ngFor="let movie of movies; trackBy: trackByMovieId">
        <div class="card h-100 shadow-sm border-0 movie-card-hover">
          <img [src]="movie.image" class="card-img-top" [alt]="movie.title" (click)="openBookingModal(movie)">
          <div class="card-body">
            <h5 class="card-title text-truncate">{{ movie.title }}</h5>
            <p class="card-text text-muted">{{ movie.genre }}</p>
            <div class="d-flex justify-content-between align-items-center text-muted small">
              <span><i class="fas fa-star text-warning me-1"></i>{{ movie.rating }}/10</span>
              <span><i class="fas fa-clock me-1"></i>{{ movie.duration }}</span>
            </div>
          </div>
          <div class="card-footer bg-white border-0">
            <button class="btn btn-primary w-100" (click)="openBookingModal(movie)">Book Now</button>
          </div>
        </div>
      </div>
    </div>
    <ng-template #noMovies>
      <div class="text-center p-5 bg-light rounded">
        <h3 class="text-muted">No movies found.</h3>
        <p>Try adjusting your search or filter criteria.</p>
      </div>
    </ng-template>
  </div>

</div>

<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="bookingModalLabel">
          <span *ngIf="selectedMovie">{{ selectedMovie.title }}</span>
        </h5>
        <button type="button" class="btn-close" (click)="closeBookingModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-book-tickets *ngIf="selectedMovie" [movie]="selectedMovie" (bookingComplete)="onBookingComplete()"></app-book-tickets>
      </div>
    </div>
  </div>
</div>
