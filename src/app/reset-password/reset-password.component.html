<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="h4 mb-3 fw-normal">Reset Password</h1>
        <p class="text-muted">Enter your email to reset your password.</p>
      </div>
      <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
        <div *ngIf="message" class="alert alert-info">{{ message }}</div>
        <div class="form-floating mb-3">
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            class="form-control"
            placeholder="name@example.com"
            [class.is-invalid]="resetForm.submitted && resetForm.controls['email'].invalid"
          />
          <label for="email">Email address</label>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
          <span *ngIf="!isLoading">Reset Password</span>
          <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Sending...</span>
        </button>
      </form>
    </div>
  </div>
</div>
