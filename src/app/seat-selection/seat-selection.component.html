<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow mb-4">
      <div class="card-header d-flex align-items-center"
        style="background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); color: #fff; font-weight: bold; font-size: 1.15rem;">
        <i class="fas fa-chair"></i>&nbsp;
        <span>Seat Management</span>
      </div>
      <div class="card-body">
        <div class="booking-summary mb-4 p-3 border rounded bg-light">
          <div class="row">
            <div class="col-md-6 mb-2">
              <strong>Movie:</strong> {{ movieTitle }}
            </div>
            <div class="col-md-6 mb-2">
              <strong>Theatre:</strong> {{ theatreName }}
            </div>
            <div class="col-md-6 mb-2">
              <strong>Ticket Price:</strong> {{ ticketPrice | currency:'INR' }}
            </div>
            <div class="col-md-6 mb-2">
              <strong>Date:</strong> {{ showDate }}
            </div>
            <div class="col-md-6 mb-2">
              <strong>Show Time:</strong> {{ showTimeStr }}
            </div>
          </div>
        </div>
        <h5 class="mb-4">Select Your Seats</h5>
        <div *ngIf="isLoading" class="text-center my-4">
          <i class="fas fa-spinner fa-spin fa-2x"></i>
          <p class="mt-2">Loading seats...</p>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <div *ngIf="!isLoading && seats.length > 0">
          <div class="seats-grid mb-3">
            <button *ngFor="let seat of seats"
              [ngClass]="{'seat-btn': true, 'selected': selectedSeats.includes(seat.seatId), 'booked': seat.status === 'booked' || seat.isBooked}"
              [disabled]="seat.status === 'booked' || seat.isBooked" (click)="toggleSeat(seat)">
              {{ seat.seatNumber }}
            </button>
          </div>
          <div class="text-right">
            <button class="btn btn-success" [disabled]="selectedSeats.length === 0" (click)="bookSeats()">Book Selected
              Seats</button>
          </div>
        </div>
        <div *ngIf="!isLoading && seats.length === 0 && !errorMessage" class="text-muted">No seats found for this show.
        </div>
      </div>
    </div>
  </div>
</div>

<app-toast-notification
  [message]="toastMessage"
  [type]="toastType"
  [show]="showToast">
</app-toast-notification>
