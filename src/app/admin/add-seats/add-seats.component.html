<app-toast-notification
  [message]="toastMessage"
  [type]="toastType"
  [show]="showToast">
</app-toast-notification>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow mb-4">
      <div class="card-header d-flex align-items-center"
        style="background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); color: #fff; font-weight: bold; font-size: 1.15rem;">
        <i class="fas fa-chair"></i>&nbsp;
        <span>{{ editingSeat ? 'Edit Seat' : 'Add Seat' }}</span>
      </div>
      <div class="card-body">
        <form [formGroup]="addSeatForm" (ngSubmit)="onSubmit()">
          <div class="form-group mb-3">
            <label for="theatreId" class="form-label">Theatre</label>
            <select id="theatreId" class="form-control" formControlName="theatreId" required>
              <option value="" disabled selected>Select a theatre</option>
              <option *ngFor="let theatre of theatres" [value]="theatre.theatreId">{{ theatre.name }}</option>
            </select>
          </div>
          <div class="form-group mb-3">
            <label for="seatNumber" class="form-label">Seat Number</label>
            <input id="seatNumber" type="text" class="form-control" formControlName="seatNumber" required />
          </div>
          <div class="form-group mb-3">
            <label for="seatType" class="form-label">Seat Type</label>
            <select id="seatType" class="form-control" formControlName="seatType" required>
              <option value="" disabled selected>Select seat type</option>
              <option value="Regular">Regular</option>
              <option value="Premium">Premium</option>
              <option value="VIP">VIP</option>
            </select>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-primary" type="submit" [disabled]="addSeatForm.invalid || isSubmitting">
              {{ editingSeat ? (isSubmitting ? 'Updating...' : 'Update Seat') : (isSubmitting ? 'Adding...' : 'Add
              Seat') }}
            </button>
            <button *ngIf="editingSeat" class="btn btn-secondary" type="button" (click)="cancelEdit()">Cancel</button>
          </div>
          <div *ngIf="editingSeat" class="alert alert-info mt-2">Editing seat: {{ editingSeat.seatNumber }}</div>
        </form>
      </div>
    </div>
  </div>
  <!-- Seat List Card -->
  <div class="col-md-7">
    <div class="card shadow mb-4">
      <div class="card-header d-flex align-items-center"
        style="background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); color: #fff; font-weight: bold; font-size: 1.15rem;">
        <i class="fas fa-th-list"></i>&nbsp;
        <span>All Seats</span>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Seat ID</th>
                <th>Theatre ID</th>
                <th>Theatre Name</th>
                <th>Seat Number</th>
                <th>Seat Type</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let seat of allSeats">
                <td>{{ seat.seatId }}</td>
                <td>{{ seat.theatreId }}</td>
                <td>{{ seat.theatreName }}</td>
                <td>{{ seat.seatNumber }}</td>
                <td>{{ seat.seatType }}</td>
                <td>
                  <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-primary" (click)="editSeat(seat)"><i class="fas fa-edit"></i>
                      Edit</button>
                    <span style="width: 0.75rem;"></span>
                    <button class="btn btn-sm btn-outline-danger" (click)="deleteSeat(seat)"><i
                        class="fas fa-trash"></i> Delete</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
