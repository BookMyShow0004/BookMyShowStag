<div class="page-header">
  <h1>Show Seat Management</h1>
</div>

<div class="form-container">
  <h2>Add Show Seat</h2>
  <form [formGroup]="seatForm" (ngSubmit)="createShowSeat()">
    <div class="form-grid">
      <div class="form-group">
        <label for="showId">Show ID</label>
        <select id="showId" formControlName="showId" required class="form-control" (change)="onShowChange()">
          <option value="" disabled>Select show</option>
          <option *ngFor="let show of shows" [value]="show.showId">
            Show: {{ show.showId }} (Movie: {{ getMovieTitleByShow(show) }}, Theater: {{ getTheaterNameByShow(show) }})
          </option>
        </select>
      </div>
      <div class="form-group">
        <label for="seatId">Seat</label>
        <select id="seatId" formControlName="seatId" required class="form-control">
          <option value="" disabled>Select seat</option>
          <option *ngFor="let seat of filteredSeats" [value]="seat.seatId">
            {{ getSeatLabel(seat) }}
          </option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit" [disabled]="seatForm.invalid">
        {{ editingSeatId ? 'Update Show Seat' : 'Add Show Seat' }}
      </button>
    </div>
  </form>
</div>

<div class="table-container" *ngIf="showSeats.length">
  <table class="movies-table">
    <thead>
      <tr>
        <th>Show ID</th>
        <th>Seat Number</th>
        <th>Seat Type</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let seat of showSeats">
        <td>
          {{ seat.seatId }}
          <span *ngIf="seat.seatNumber">, {{ seat.seatNumber }}</span>
          <span *ngIf="seat.seatType">, {{ seat.seatType }}</span>
          <span *ngIf="getTheaterNameByShow(seat)">, {{ getTheaterNameByShow(seat) }}</span>
          <span *ngIf="!getTheaterNameByShow(seat) && seat.theatreId">, {{ seat.theatreId }}</span>
        </td>
        <td>{{ seat.seatNumber }}</td>
        <td>{{ seat.seatType }}</td>
        <td>{{ seat.isBooked ? 'Booked' : 'Available' }}</td>
        <td>
          <button type="button" class="btn btn-sm btn-primary btn-action" (click)="editShowSeat(seat)">
            <i class="fas fa-edit"></i> Edit
          </button>
          <button type="button" class="btn btn-sm btn-danger btn-action" (click)="deleteShowSeat(seat)">
            <i class="fas fa-trash"></i> Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
