<div class="admin-layout">
  <button class="hamburger-below-navbar" (click)="toggleSidebar()" aria-label="Open sidebar">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>
  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Admin Portal</h2>
    </div>
    <nav class="sidebar-nav"> 
      <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">
        <i class="fas fa-film"></i>
        <span>User Management</span>
      </a>
      <a routerLink="/admin/movies" routerLinkActive="active" class="nav-link">
        <i class="fas fa-film"></i>
        <span>Movie Management</span>
      </a>
      <a routerLink="/admin/cities" routerLinkActive="active" class="nav-link">
        <i class="fas fa-building"></i>
        <span>City Management</span>
      </a>
      <a routerLink="/admin/theatres" routerLinkActive="active" class="nav-link">
        <i class="fas fa-building"></i>
        <span>Theatre Management</span>
      </a>
      <a routerLink="/admin/seats" routerLinkActive="active" class="nav-link">
        <i class="fas fa-chair"></i>
        <span>Seat Management</span>
      </a>
      <a routerLink="/admin/shows" routerLinkActive="active" class="nav-link">
        <i class="fas fa-ticket-alt"></i>
        <span>Show Management</span>
      </a>
      <a routerLink="/admin/show-seats" routerLinkActive="active" class="nav-link">
        <i class="fas fa-th"></i>
        <span>Show Seat Management</span>
      </a>
      <a routerLink="/admin/bookings" routerLinkActive="active" class="nav-link">
        <i class="fas fa-th"></i>
        <span>Booking Management</span>
      </a>
      <a routerLink="/admin/comments" routerLinkActive="active" class="nav-link">
        <i class="fas fa-comments"></i>
        <span>Comment Moderation</span>
      </a>
      <a routerLink="/" class="nav-link return-link">
        <i class="fas fa-arrow-left"></i>
        <span>Return to Site</span>
      </a>
    </nav>
  </aside>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
