<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 800px;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h2 class="logo-text">book<span>my</span>show</h2>
        <h1 class="h3 mb-3 fw-normal">Create your Account</h1>
      </div>

      <p class="text-muted">Welcome back! Please enter your details.</p>

      <form (ngSubmit)="onRegister()" #signupForm="ngForm">
        <!-- Error/Success Messages -->
        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>

        <div class="row g-3">
          <!-- Name -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" id="name" name="name" [(ngModel)]="registerData.name" required class="form-control" placeholder="John Doe">
              <label for="name">Full Name</label>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="email" id="email" name="email" [(ngModel)]="registerData.email" required email class="form-control" placeholder="name@example.com">
              <label for="email">Email Address</label>
            </div>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="password" id="password" name="password" [(ngModel)]="registerData.password" required class="form-control" placeholder="Password">
              <label for="password">Password</label>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="registerData.confirmPassword" required class="form-control" placeholder="Confirm Password">
              <label for="confirmPassword">Confirm Password</label>
            </div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="tel" id="phone" name="phone" [(ngModel)]="registerData.phone" required class="form-control" placeholder="Phone Number">
              <label for="phone">Phone Number</label>
            </div>
          </div>

          <!-- City -->
          <div class="col-md-6">
            <div class="form-floating">
              <select id="city" name="city" [(ngModel)]="registerData.city" required class="form-select">
                <option value="" disabled>Select your city</option>
                <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
              </select>
              <label for="city">City</label>
            </div>
          </div>
        </div>

        <!-- Captcha -->
        <div class="mt-4">
          <label class="form-label">Security Verification</label>
          <div class="input-group">
            <span class="input-group-text captcha-image">{{ captchaText }}</span>
            <button class="btn btn-outline-secondary" type="button" (click)="generateCaptcha()">
              <i class="fas fa-sync-alt"></i>
            </button>
            <div class="form-floating">
              <input type="text" id="captcha" name="captcha" [(ngModel)]="userCaptcha" required class="form-control" placeholder="Enter code">
              <label for="captcha">Enter code</label>
            </div>
          </div>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 btn-lg mt-4" [disabled]="isLoading || !signupForm.valid">
          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading">
            <i class="fas fa-spinner fa-spin"></i> Creating Account...
          </span>
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        Already have an account? 
        <a routerLink="/login" class="text-decoration-none fw-bold">Sign In</a>
      </p>
    </div>
  </div>
</div>
