<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 800px;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h2 class="logo-text">book<span>my</span>show</h2>
        <h1 class="h3 mb-3 fw-normal">Create your Account</h1>
      </div>

      <p class="text-muted">Welcome back! Please enter your details.</p>

      <app-toast-notification
        [message]="toastMessage"
        [type]="toastType"
        [show]="showToast">
      </app-toast-notification>

      <form (ngSubmit)="onRegister()" #signupForm="ngForm">
        <!-- Error/Success Messages -->
        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>

        <div class="row g-3">
          <!-- Full Name -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" id="fullName" name="fullName" [(ngModel)]="registerData.fullName" required class="form-control" placeholder="John Doe">
              <label for="fullName">Full Name</label>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <div class="form-floating">
              <input type="email" id="email" name="email" [(ngModel)]="registerData.email" required email class="form-control" placeholder="john.doe@example.com">
              <label for="email">Email Address</label>
            </div>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <div class="form-floating position-relative">
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="registerData.password" required class="form-control" placeholder="Password">
              <label for="password">Password</label>
              <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2" style="z-index:2;" (click)="showPassword = !showPassword" tabindex="-1">
                <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
            <div *ngIf="passwordErrors.length > 0" class="text-danger mt-1 small">
              <ul class="mb-0 ps-3">
                <li *ngFor="let err of passwordErrors">{{ err }}</li>
              </ul>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <div class="form-floating position-relative">
              <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword" [(ngModel)]="registerData.confirmPassword" required class="form-control" placeholder="Confirm Password">
              <label for="confirmPassword">Confirm Password</label>
              <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2" style="z-index:2;" (click)="showConfirmPassword = !showConfirmPassword" tabindex="-1">
                <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <!-- City -->
          <div class="col-md-6">
            <div class="form-floating">
              <select id="city" name="city" [(ngModel)]="registerData.cityId" required class="form-select">
                <option [ngValue]="null" disabled>Select your city</option>
                <option *ngFor="let city of cities" [ngValue]="city.cityId">{{ city.cityName }}</option>
              </select>
              <label for="city">City</label>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="form-group">
          <button type="submit" class="btn btn-primary w-100 btn-lg mt-4" [disabled]="isLoading || !signupForm.valid">
            <span *ngIf="!isLoading">Create Account</span>
            <span *ngIf="isLoading">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Creating...
            </span>
          </button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0">
        Already have an account?
        <a routerLink="/login" class="text-decoration-none fw-bold">Sign In</a>
      </p>
    </div>
  </div>
</div>
